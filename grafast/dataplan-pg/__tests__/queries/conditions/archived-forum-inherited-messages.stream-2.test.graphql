## expect(errors).toBeFalsy()
## expect(queries).toHaveLength(2);
{
  forums(includeArchived: EXCLUSIVELY) {
    name
    messagesConnection(includeArchived: INHERIT) {
      # nodes and edges share the same rows, and pageInfo needs a complete result.
      # Fetch once up front; GraphQL delivery can still be incremental.
      nodes @stream {
        body
        author {
          username
          gravatarUrl
        }
      }
      edges @stream {
        cursor
        node {
          body
          author {
            username
            gravatarUrl
          }
        }
      }
      pageInfo {
        hasNextPage
        hasPreviousPage
      }
      totalCount
    }
  }
}
