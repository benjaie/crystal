{
  forums(includeArchived: EXCLUSIVELY) {
    name
    messagesConnection(includeArchived: INHERIT) {
      nodes @stream {
        body
        author {
          username
          gravatarUrl
        }
      }
      # No @stream here: edges fully consumes its own iterator while nodes
      # consumes another incrementally, sharing the same SQL pages.
      edges {
        cursor
        node {
          author {
            username
          }
        }
      }
      ... @defer {
        pageInfo {
          hasNextPage
          hasPreviousPage
        }
        totalCount
      }
    }
  }
}
